# Sentinel production stack — pulls pre-built images from GHCR instead
# of building locally. Use this on the prod LXC after the
# `.github/workflows/docker-publish.yml` job has published images to
# `ghcr.io/jkmesches/sentinel-{backend,frontend}`.
#
# Pin to a specific tag for stability, or use `:latest` to track main:
#   SENTINEL_TAG=1.2.3 docker compose -f ops/docker-compose.ghcr.yml \
#       --env-file ops/.env.prod pull
#   SENTINEL_TAG=1.2.3 docker compose -f ops/docker-compose.ghcr.yml \
#       --env-file ops/.env.prod up -d
#
# If the GHCR packages are still private, log in once with a personal
# access token (read:packages scope is enough):
#   echo "$GHCR_PAT" | docker login ghcr.io -u <user> --password-stdin
#
# This file deliberately mirrors docker-compose.prod.yml so a switch
# between "build locally" and "pull from GHCR" only changes the file
# argument — env vars, volumes, network, ports all match.

name: sentinel

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB:       ${POSTGRES_DB:-sentinel}
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sentinel} -d $${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sentinel

  backend:
    image: ghcr.io/jkmesches/sentinel-backend:${SENTINEL_TAG:-latest}
    container_name: sentinel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SENTINEL_DB_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      # Which radar network this instance watches. Neither compose file has an
      # `env_file:`, so --env-file supplies ${...} interpolation ONLY and a
      # variable reaches the container only by being named here. v0.6.0 shipped
      # ops/.env.prod.example documenting SENTINEL_PROFILE without this line,
      # so setting it there did nothing and the backend stayed on its default.
      #
      # That failed in the worst direction: an XQPI stack would start clean,
      # pass its health checks, and monitor AQPI's product list against a
      # the secondary archive mount — every check reporting missing products, reading as a
      # broken XQPI rather than a misconfigured one. Precisely the "quietly
      # watching the wrong network" case config.py refuses a bad VALUE to
      # prevent, arriving instead through an unset one.
      SENTINEL_PROFILE: ${SENTINEL_PROFILE:-aqpi}
      SENTINEL_BASE:   ${SENTINEL_BASE:-https://radarca.engr.colostate.edu}
      SENTINEL_API_HOST: 0.0.0.0
      SENTINEL_API_PORT: 8000
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_ARCHIVE_ENABLED: "1"
      SENTINEL_ARCHIVE_ROOT:    /data/archive
      SENTINEL_ARCHIVE_RETENTION_DAYS: ${SENTINEL_ARCHIVE_RETENTION_DAYS:-}
      # Rows older than this are exported to /data/cold as compressed CSV and
      # then dropped from the live tables. Unset = keep everything forever.
      SENTINEL_DB_RETENTION_DAYS: ${SENTINEL_DB_RETENTION_DAYS:-}
      SENTINEL_COLD_ROOT:       /data/cold
      # A file each store must hold before anything is written there, so a share
      # that failed to attach is never filled from the local disk. Unset = none.
      SENTINEL_STORAGE_MARKER: ${SENTINEL_STORAGE_MARKER:-}
      SENTINEL_RETENTION_HOUR_UTC: ${SENTINEL_RETENTION_HOUR_UTC:-9}
      SENTINEL_ADMIN_EMAIL:        ${SENTINEL_ADMIN_EMAIL:-}
      SENTINEL_ADMIN_PASSWORD:     ${SENTINEL_ADMIN_PASSWORD:-}
      SENTINEL_ADMIN_DISPLAY_NAME: ${SENTINEL_ADMIN_DISPLAY_NAME:-}
      SENTINEL_PUBLIC_URL:         ${SENTINEL_PUBLIC_URL:-}
      # Continuous capture of every moment + tilt. Off unless set to 1; see
      # docs/91-env-vars.md for the measured cost before enabling.
      SENTINEL_PREWARM_ENABLED:     ${SENTINEL_PREWARM_ENABLED:-0}
      SENTINEL_PREWARM_INTERVAL_S:  ${SENTINEL_PREWARM_INTERVAL_S:-300}
      SENTINEL_PREWARM_CONCURRENCY: ${SENTINEL_PREWARM_CONCURRENCY:-3}
      # Backend (filesystem) checks, stages LB1/LB2. Read both archives directly
      # instead of inferring product health from radarca. Unset = the checks are
      # never registered, which is what the no-VPN dev deployment wants: it mounts
      # neither share, so the question is unanswerable there. These are CONTAINER
      # paths and must match the mounts below.
      SENTINEL_BACKEND_ROOT: ${SENTINEL_BACKEND_ROOT:-}
      SENTINEL_SSCB_ROOT:    ${SENTINEL_SSCB_ROOT:-}
      # What the dashboard calls each tree. The image ships role words, so a
      # deployment names its own trees here. Tags stay two characters wide.
      SENTINEL_SOURCE_TAG:        ${SENTINEL_SOURCE_TAG:-}
      SENTINEL_SOURCE_LABEL:      ${SENTINEL_SOURCE_LABEL:-}
      SENTINEL_SSCB_SOURCE_TAG:   ${SENTINEL_SSCB_SOURCE_TAG:-}
      SENTINEL_SSCB_SOURCE_LABEL: ${SENTINEL_SSCB_SOURCE_LABEL:-}
      # Where radar-display's document root is mounted, when it is not
      # htdocs/ under SENTINEL_BACKEND_ROOT. XQPI is the case that needs it:
      # FLOW's per-elevation frames sit beside the five AQPI radars on the main archive,
      # under a root this deployment does not mount. Unset leaves the tilt
      # routes on HTTP, which for XQPI means no tilts at all.
      SENTINEL_TILT_ROOT: ${SENTINEL_TILT_ROOT:-}
      # The composite's input staging share. Its own mount: it is NOT under
      # SENTINEL_BACKEND_ROOT, and v0.8.0 assumed it was — see
      # config.COMPOSITE_INPUT_TREE. Unset, the layer3.input.* checks simply
      # do not register.
      SENTINEL_RECENTFILES_DIR: ${SENTINEL_RECENTFILES_DIR:-}
    # The image's user, uid 1000, with SENTINEL_STORAGE_GID as its primary
    # group, so it can write store folders a group owns on a share. A primary
    # group because an NFS server that looks groups up itself ignores a
    # client's extra groups. A number, since the image has no such group by
    # name. The default is the user's own group, which changes nothing.
    user: "1000:${SENTINEL_STORAGE_GID:-1000}"
    volumes:
      # === Load-bearing: these accept a HOST PATH, not just a volume name ===
      #
      # A bare name is a named volume; a leading slash is a bind mount. This
      # file used to hard-code `sentinel_archive`, with no way to point it
      # anywhere — while claiming in its header to mirror prod.yml exactly.
      # Switching a production host from prod.yml to this one WOULD therefore
      # have detached the real archive silently: the container comes up
      # healthy, serves an empty gallery, and begins writing new images to a
      # fresh volume while the existing archive sits unreferenced. Nothing
      # errors, because an empty archive is indistinguishable from a new one.
      #
      # Conditional, not history: the hole was found and closed by the
      # parity work, never hit in production. Verified 2026-10-04 on
      # the test deployment host — the sentinel_archive and sentinel_cold named volumes are
      # both empty (0 entries), the container binds /mnt/aqpi-data/archive, and
      # image_archive spans 2026-05-16 to date with day-one frames still on
      # disk. The earlier past tense here was read by a teammate as a real
      # 22 GB loss; it was not. (The archive is ~64 GB now, not 22.)
      #
      # Set SENTINEL_ARCHIVE_HOST_PATH / SENTINEL_COLD_HOST_PATH to the same
      # values prod.yml uses on that host.
      - ${SENTINEL_ARCHIVE_HOST_PATH:-sentinel_archive}:/data/archive
      - ${SENTINEL_COLD_HOST_PATH:-sentinel_cold}:/data/cold
      # Read-only view of the host directory ops/backup.sh writes to, so
      # layer0.self.backup can read status.json and alarm when the nightly dump
      # goes stale or starts failing. Point SENTINEL_BACKUP_HOST_PATH at the
      # same absolute path as the cron job's SENTINEL_BACKUP_DIR. Left unset,
      # the check reports "backup monitoring not configured" and stays silent.
      - ${SENTINEL_BACKUP_HOST_PATH:-sentinel_backups}:/data/backups:ro
      # Read-only view of the published product tree on the main archive and the C-band tree on
      # the secondary archive, for the LB1/LB2 checks. Same shape as the backup mount above:
      # defaults to an empty named volume so a deploy without the shares is still
      # valid, and :ro so Sentinel can never modify what it monitors.
      - ${SENTINEL_BACKEND_HOST_PATH:-sentinel_backend_unset}:/backend:ro
      - ${SENTINEL_SSCB_HOST_PATH:-sentinel_sscb_unset}:/sscb:ro
      - ${SENTINEL_RECENTFILES_HOST_PATH:-sentinel_recentfiles_unset}:/recentfiles:ro
      # radar-display's document root, for the per-elevation tilts. Point
      # SENTINEL_TILT_HOST_PATH at it and SENTINEL_TILT_ROOT at /tilt.
      - ${SENTINEL_TILT_HOST_PATH:-sentinel_tilt_unset}:/tilt:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - sentinel

  frontend:
    image: ghcr.io/jkmesches/sentinel-frontend:${SENTINEL_TAG:-latest}
    container_name: sentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - sentinel

volumes:
  sentinel_pgdata:
    name: sentinel_pgdata
  sentinel_archive:
    name: sentinel_archive
  sentinel_cold:
    name: sentinel_cold
  sentinel_backups:
  # Fallbacks so the file stays valid when the LB1/LB2 shares are not configured.
  # A deploy with the NFS mounts points SENTINEL_BACKEND_HOST_PATH / _SSCB_HOST_PATH / _RECENTFILES_HOST_PATH
  # at the real host paths and these go unused.
  sentinel_backend_unset:
  sentinel_sscb_unset:
  sentinel_recentfiles_unset:
  sentinel_tilt_unset:

networks:
  sentinel:
    name: sentinel
