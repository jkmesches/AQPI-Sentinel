# Sentinel production stack — pulls pre-built images from GHCR instead
# of building locally. Use this on the prod LXC after the
# `.github/workflows/docker-publish.yml` job has published images to
# `ghcr.io/jkmesches/sentinel-{backend,frontend}`.
#
# Pin to a specific tag for stability, or use `:latest` to track main:
#   SENTINEL_TAG=1.2.3 docker compose -f ops/docker-compose.ghcr.yml \
#       --env-file ops/.env.prod pull
#   SENTINEL_TAG=1.2.3 docker compose -f ops/docker-compose.ghcr.yml \
#       --env-file ops/.env.prod up -d
#
# If the GHCR packages are still private, log in once with a personal
# access token (read:packages scope is enough):
#   echo "$GHCR_PAT" | docker login ghcr.io -u <user> --password-stdin
#
# This file deliberately mirrors docker-compose.prod.yml so a switch
# between "build locally" and "pull from GHCR" only changes the file
# argument — env vars, volumes, network, ports all match.

name: sentinel

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB:       ${POSTGRES_DB:-sentinel}
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sentinel} -d $${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sentinel

  backend:
    image: ghcr.io/jkmesches/sentinel-backend:${SENTINEL_TAG:-latest}
    container_name: sentinel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SENTINEL_DB_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_BASE:   ${SENTINEL_BASE:-https://radarca.engr.colostate.edu}
      SENTINEL_API_HOST: 0.0.0.0
      SENTINEL_API_PORT: 8000
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_ARCHIVE_ENABLED: "1"
      SENTINEL_ARCHIVE_ROOT:    /data/archive
      SENTINEL_ARCHIVE_RETENTION_DAYS: ${SENTINEL_ARCHIVE_RETENTION_DAYS:-}
      # Rows older than this are exported to /data/cold as compressed CSV and
      # then dropped from the live tables. Unset = keep everything forever.
      SENTINEL_DB_RETENTION_DAYS: ${SENTINEL_DB_RETENTION_DAYS:-}
      SENTINEL_COLD_ROOT:       /data/cold
      SENTINEL_RETENTION_HOUR_UTC: ${SENTINEL_RETENTION_HOUR_UTC:-9}
      SENTINEL_ADMIN_EMAIL:        ${SENTINEL_ADMIN_EMAIL:-}
      SENTINEL_ADMIN_PASSWORD:     ${SENTINEL_ADMIN_PASSWORD:-}
      SENTINEL_ADMIN_DISPLAY_NAME: ${SENTINEL_ADMIN_DISPLAY_NAME:-}
      SENTINEL_PUBLIC_URL:         ${SENTINEL_PUBLIC_URL:-}
      # Continuous capture of every moment + tilt. Off unless set to 1; see
      # docs/91-env-vars.md for the measured cost before enabling.
      SENTINEL_PREWARM_ENABLED:     ${SENTINEL_PREWARM_ENABLED:-0}
      SENTINEL_PREWARM_INTERVAL_S:  ${SENTINEL_PREWARM_INTERVAL_S:-300}
      SENTINEL_PREWARM_CONCURRENCY: ${SENTINEL_PREWARM_CONCURRENCY:-3}
    volumes:
      # === Load-bearing: these accept a HOST PATH, not just a volume name ===
      #
      # A bare name is a named volume; a leading slash is a bind mount. This
      # file used to hard-code `sentinel_archive`, with no way to point it
      # anywhere — while claiming in its header to mirror prod.yml exactly.
      # Switching a production host from prod.yml to this one therefore
      # detached the real archive silently: the container came up healthy,
      # served an empty gallery, and began writing new images to the container
      # disk while 22GB sat unreferenced on the NFS share. Nothing errored,
      # because an empty archive is indistinguishable from a new one.
      #
      # Set SENTINEL_ARCHIVE_HOST_PATH / SENTINEL_COLD_HOST_PATH to the same
      # values prod.yml uses on that host.
      - ${SENTINEL_ARCHIVE_HOST_PATH:-sentinel_archive}:/data/archive
      - ${SENTINEL_COLD_HOST_PATH:-sentinel_cold}:/data/cold
      # Read-only view of the host directory ops/backup.sh writes to, so
      # layer0.self.backup can read status.json and alarm when the nightly dump
      # goes stale or starts failing. Point SENTINEL_BACKUP_HOST_PATH at the
      # same absolute path as the cron job's SENTINEL_BACKUP_DIR. Left unset,
      # the check reports "backup monitoring not configured" and stays silent.
      - ${SENTINEL_BACKUP_HOST_PATH:-sentinel_backups}:/data/backups:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - sentinel

  frontend:
    image: ghcr.io/jkmesches/sentinel-frontend:${SENTINEL_TAG:-latest}
    container_name: sentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - sentinel

volumes:
  sentinel_pgdata:
    name: sentinel_pgdata
  sentinel_archive:
    name: sentinel_archive
  sentinel_cold:
    name: sentinel_cold
  sentinel_backups:

networks:
  sentinel:
    name: sentinel
