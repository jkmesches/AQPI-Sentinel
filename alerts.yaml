# Sentinel alert routing config. Reload via POST /api/alerts/reload (soon).
# ${VARS} are env-interpolated at load.

# --- SMTP for the email sink (optional). If unset, email sink is disabled. ---
# smtp:
#   host: smtp.fastmail.com
#   port: 587
#   starttls: true
#   username: ${SMTP_USER}
#   password: ${SMTP_PASS}
#   from: "Sentinel <sentinel@yourdomain.example>"
#   reply_to: ops@yourdomain.example

receivers:
  - name: console
    console: true

  # Example email receiver (commented until SMTP is configured):
  # - name: oncall-primary
  #   email: ["you@example.com"]
  #   template: default
  #
  # Example webhook receiver (Discord, ntfy, etc.):
  # - name: chat
  #   webhook: ${DISCORD_WEBHOOK_URL}

escalation_policies:
  - name: standard
    steps:
      - delay: 0m
        receivers: [console]
      # When SMTP is configured, add escalating steps:
      # - delay: 15m
      #   receivers: [oncall-primary]
      # - delay: 60m
      #   receivers: [oncall-primary, chat]

  - name: hard-page
    steps:
      - delay: 0m
        receivers: [console]
      # - delay: 5m
      #   receivers: [oncall-primary]

# --- How long a condition must persist before it becomes an alarm ---------
#
# Without a hold-down, one bad check run opens an alarm and one good run
# closes it. Measured over the 7 days to 2026-09-03: 2,308 alarms, 91.9% of
# which closed in under five minutes. They flapped and self-resolved before a
# human could look — and each would have been an email once SMTP was on.
#
# Surviving alarms by hold-down, same window:
#     none 2,308  |  2m 719  |  5m 187  |  10m 122
# All 21 alarms longer than four hours, and all 7 still open, are in the 187.
#
# Every individual bad run is still recorded and still drawn on the timeline.
# This only changes what counts as an *alarm*.
hold_down: 5m

routes:
  # L0 — site / origin down: page immediately, hard.
  #
  # Shorter hold-down than the rest, deliberately. This route exists to page
  # fast on a real outage, so five minutes is too much latency to accept. But
  # it cannot be zero: layer0.origin.alive flapped 69 times in seven days,
  # averaging 44 seconds, and every one of those would have hard-paged. Two
  # minutes clears the flaps with the least delay that does.
  - match: {stage: L0}
    severity_floor: critical
    policy: hard-page
    hold_down: 2m
    repeat_interval: 10m

  # --- The DROPS producer: deliberately NON-PAGING -----------------------
  #
  # FIRST among the LB routes, because first-match wins and the LB3 stage
  # route below would otherwise swallow it.
  #
  # Matched on `check_id`, not on stage. It shares stage LB3 with composite
  # participation, which IS paging — the two are both "backend processing" but
  # they differ in consequence: a radar silently leaving the composite changes
  # what the published products MEAN, while the DROPS tree is read by nothing
  # in the live chain. Giving the producer its own stage to express that would
  # add an enumeration surface across the frontend for one row.
  #
  # The check also caps its own status at `warn` so it cannot auto-promote.
  # Two independent statements of one intent, deliberately: whichever of them
  # a future editor removes, the other still holds. See
  # Layer3DropsProducerCheck.
  - match: {check_id: layer3.backend.drops}
    policy: standard
    repeat_interval: 12h

  # --- Backend (filesystem-read) stages: authoritative -------------------
  #
  # These read K2/trinity directly rather than through radarca, which is why
  # they are separate stages at all — see backend/stages.py. Until now they
  # had no route and fell through to the catch-all at 4h, so the AUTHORITATIVE
  # observation repeated four times less often than the radarca-derived one it
  # was meant to outrank. That was an omission when LB1/LB2 were added in
  # v0.5.0, not a decision.
  - match: {stage: LB2}
    policy: standard
    repeat_interval: 1h

  - match: {stage: LB1}
    policy: standard
    repeat_interval: 1h

  # LB3 — composite participation. A radar absent from the composite's input
  # receipt is not a degraded product, it is a product computed from fewer
  # radars than it claims, and nothing else in the system reports it.
  - match: {stage: LB3}
    policy: standard
    repeat_interval: 1h

  # L2 radar: anything not pass goes to standard.
  - match: {stage: L2}
    policy: standard
    repeat_interval: 1h

  # L1 product: standard, with hourly repeats while open.
  - match: {stage: L1}
    policy: standard
    repeat_interval: 1h

  # Catch-all: anything else just goes to console.
  - match: {}
    policy: standard
    repeat_interval: 4h

silences: []
